name: macOS build

# PyInstaller cannot cross-compile, so the Mac build has to run on a Mac.
# This workflow uses GitHub's hosted Apple silicon runner: no Mac hardware needed.
# The repo's Collins word lists are not committed, so this builds the free
# (--store) variant that ships ENABLE only.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  macos:
    # macos-latest = Apple silicon (arm64). Use macos-15-intel for an Intel build.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame==2.6.1 pyinstaller

      - name: Build the Quackle engine
        run: |
          python tools/build_engine.py
          file engine/qengine

      - name: Build Tessera.app and Tessera.dmg
        env:
          CODESIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: python tools/build_exe.py --store --dmg

      # Prove the bundle actually launches on macOS: Python, pygame, the data
      # files and the Quackle engine, all inside the signed .app.
      - name: Selftest the built app
        run: |
          dist/store/Tessera.app/Contents/MacOS/Tessera --selftest
          echo "--- selftest log ---"
          cat "${TMPDIR:-/tmp}/tessera_selftest.log"

      # Render the real screens on Apple silicon (offscreen, dummy video driver).
      - name: Render screens on macOS
        run: python tools/screenshot.py

      # A .app is a directory: zip it so permissions and symlinks survive.
      # --store puts the bundle in dist/store/, not dist/.
      - name: Zip the app bundle
        run: ditto -c -k --sequesterRsrc --keepParent dist/store/Tessera.app dist/Tessera.app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Tessera-macos
          path: |
            dist/Tessera.dmg
            dist/Tessera.app.zip
            shots/*.png
          if-no-files-found: error
